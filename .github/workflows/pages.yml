# Publishes the landing page to GitHub Pages on every push to main.
# Turn on once: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Only the page and what it loads are published (not tools/ or the notes).
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site files
        run: |
          mkdir _site
          cp -r index.html pitch.css pitch.js crest.svg fonts screens _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
